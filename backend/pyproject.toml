[project]
name = "skillspector-web-api"
version = "1.1.1"
description = "Thin FastAPI wrapper around skillspector's scan pipeline"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "skillspector @ git+https://github.com/NVIDIA/skillspector.git@c7958a3268d9498644b22edb75d0f051bbc8cbfc",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "vercel-queue>=0.1",
    "vercel-sandbox>=0.7",
    "cryptography>=44",
]

# Hosted mode: what Vercel builds for the `api` service (see vercel.ts, whose entrypoint is this
# file): the FastAPI app, and a queue-triggered function from this module's @subscribe handlers.
[tool.vercel]
entrypoint = "app.main:app"

[[tool.vercel.subscribers]]
entrypoint = "app.jobs.queue_worker"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
