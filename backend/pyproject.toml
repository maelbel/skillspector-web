[project]
name = "skillspector-web-api"
version = "0.1.1"
description = "Thin FastAPI wrapper around skillspector's scan pipeline"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "skillspector @ git+https://github.com/NVIDIA/skillspector.git",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
