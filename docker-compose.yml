name: skillspector-web
services:
  api:
    container_name: skillspector-api
    build:
      context: ./backend
      target: development
    restart: unless-stopped
    env_file:
      - path: ./backend/.env.local
        required: false
    volumes:
      - ./backend:/app
    tty: true
    networks:
      - internal

  web:
    container_name: skillspector-web
    build:
      context: .
      target: development
    restart: unless-stopped
    environment:
      NODE_ENV: development
      NUXT_API_BASE: http://api:8000
      NODE_OPTIONS: "--max-old-space-size=512"
    ports:
      - "3005:3000"
    volumes:
      - ./:/app
    tty: true
    depends_on:
      - api
    networks:
      - internal

networks:
  internal:
    driver: bridge
