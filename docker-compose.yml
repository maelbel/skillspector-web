name: skillspector-web
services:
  api:
    container_name: skillspector-api
    build:
      context: ./backend
      target: development
    restart: unless-stopped
    env_file:
      - path: ./backend/.env.local
        required: false
    volumes:
      - ./backend:/app
      - claude_cli_auth:/root
    tty: true
    networks:
      - internal

  web:
    container_name: skillspector-web
    build:
      context: .
      target: development
    restart: unless-stopped
    user: node
    environment:
      NODE_ENV: development
      NUXT_API_BASE: http://api:8000
      # nuxt dev outgrows 512 MB after a few minutes of reloads, and aborts.
      NODE_OPTIONS: "--max-old-space-size=1536"
    # An abort would otherwise dump several GB of core into the bind-mounted checkout.
    ulimits:
      core: 0
    ports:
      - "3005:3000"
    volumes:
      - ./:/app
    tty: true
    depends_on:
      - api
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  claude_cli_auth:
