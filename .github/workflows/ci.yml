name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    # Every storage test runs on SQLite and, through TEST_DATABASE_URL, on Postgres.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: skillspector_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/skillspector_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest
      - run: uv run python -c "from app.main import app"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build

  # The hosted configuration: vercel.ts must compile, and both services must build the way Vercel
  # builds them, including the scan queue's subscriber. Offline: no Vercel project or token needed.
  hosted:
    runs-on: ubuntu-latest
    env:
      ENABLE_EXPERIMENTAL_COREPACK: "1"
      NUXT_PUBLIC_BOTID: "true"
      # On Actions, Nitro detects GitHub rather than Vercel and would build for plain Node.
      NITRO_PRESET: vercel
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v3
      - name: Stand in for `vercel pull`
        run: |
          mkdir -p .vercel
          echo '{"projectId":"prj_ci","orgId":"team_ci","settings":{"framework":"services"}}' > .vercel/project.json
      - run: pnpm dlx vercel@62.0.0 build --yes
      - name: Check the build output
        run: |
          out=.vercel/output
          jq -e '.crons | map(.path) | index("/api/internal/retention")' $out/config.json
          jq -e '[.routes[] | select(.destination.service?)] | map(.destination.service) == ["web"]' $out/config.json
          test -d $out/services/web/functions
          test -d $out/services/api/functions/fastapi.func
          # Scans boot from the snapshot recorded here, read at runtime (app/sandbox_snapshot.py).
          echo "::group::layout (temporary)"; find $out/services/api/functions/fastapi.func -maxdepth 3 | head -60; jq 'del(.filePathMap) + {filePathMapKeys: ((.filePathMap // {}) | keys | map(select(test("sandbox"))))}' $out/services/api/functions/fastapi.func/.vc-config.json; grep -rl sandbox_snapshot_record $out/services/api | head; echo "::endgroup::"
          find $out/services/api/functions/fastapi.func -name sandbox_snapshot_record.py | grep -q .
          # The scan subscriber: a function triggered by the `scans` topic.
          jq -e -s 'map(.experimentalTriggers // [] | .[] | select(.topic == "scans")) | length > 0' \
            $(find $out/services/api/functions/_py_subscribers -name .vc-config.json)

  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - component: api
            context: ./backend
          - component: web
            context: .
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: production
          push: false
